# AWT Visual Regression — GitHub Action
#
# Copy this file to your project's .github/workflows/ directory.
# Prerequisites:
#   1. Run `aat snapshot` locally and commit .aat/baselines/ to your repo
#   2. Have scenario YAML files in scenarios/ (or custom path)
#
# This workflow:
#   - Triggers on pull requests
#   - Runs `aat diff` against committed baselines
#   - Posts results as a PR comment
#   - Fails the check if any step is below threshold

name: AWT Visual Regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: awt-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AWT
        run: |
          pip install aat-devqa
          playwright install --with-deps chromium

      # Optional: start your dev server here
      # - name: Start dev server
      #   run: |
      #     npm start &
      #     sleep 5

      - name: Run visual diff
        id: diff
        continue-on-error: true
        run: |
          aat diff scenarios/ --format=github --threshold=0.95 > /tmp/awt-comment.md 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/awt-comment.md', 'utf8');
            } catch {
              body = '## ⚠��� AWT Visual Regression\n\nFailed to generate report. Check the workflow logs.';
            }

            // Find existing AWT comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AWT Visual Regression')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if regression detected
        if: steps.diff.outputs.exit_code != '0'
        run: |
          echo "Visual regression detected. See PR comment for details."
          exit 1
