version: '3.8'

services:
  aat:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-watch-tester:latest
    container_name: ai-watch-tester
    working_dir: /app

    volumes:
      - .:/app
      - ./scenarios:/app/scenarios
      - ./.aat:/app/.aat
      - ~/.cache/ms-playwright:/root/.cache/ms-playwright
      # 不挂载 .venv，让容器创建自己的虚拟环境

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app
      - PATH=/usr/local/bin:/usr/bin:/bin
      # AI API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY:-}
      - ZHIPUAI_MODEL=${ZHIPUAI_MODEL:-glm-4-flash}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    ports:
      - "9500:9500"

    command: >
      bash -c "
        echo '=== Starting Dashboard ===' &&
        aat dashboard --host 0.0.0.0 --port 9500
      "

    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
