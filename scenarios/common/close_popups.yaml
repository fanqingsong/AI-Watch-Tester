id: "SC-900"
name: "Close Popups"
description: "Dismiss common popups, cookie banners, modals"

steps:
  - step: 1
    action: press_key
    value: "Escape"
    description: "Dismiss any open modal"

  - step: 2
    action: find_and_click
    target:
      text: "닫기"
    if_visible: true
    description: "Close popup (if visible)"

  - step: 3
    action: find_and_click
    target:
      text: "동의"
    if_visible: true
    description: "Accept cookie consent (if visible)"

  - step: 4
    action: find_and_click
    target:
      text: "Close"
    if_visible: true
    description: "Close English popup (if visible)"
