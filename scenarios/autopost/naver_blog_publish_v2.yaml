id: SC-100
name: Naver Blog Auto Publish v2
description: Read AutoPost output/latest.json and auto-publish to Naver Blog
tags: [autopost, naver, blog, publish]

vars:
  title: "{{env.POST_TITLE}}"
  content: "{{env.POST_CONTENT}}"
  image_0: "{{env.IMAGE_0}}"
  image_1: "{{env.IMAGE_1}}"
  image_2: "{{env.IMAGE_2}}"

steps:
  # 1. Load session
  - step: 1
    action: load_session
    name: "naver_login"
    description: "Load Naver login session"
    critical: true
    on_fail: "stop"

  # 2. Navigate to write page
  - step: 2
    action: navigate
    value: "https://blog.naver.com/GoBlogWrite.naver"
    description: "Navigate to Naver Blog write page"
    timeout_ms: 15000

  - step: 3
    action: wait
    value: "5000"
    description: "Wait for editor loading"

  # 3. Handle draft popup
  - step: 4
    action: if_visible
    target:
      text: "You have a draft"
    region: center
    then:
      - action: find_and_click
        target:
          selector: ".se-popup-alert-confirm button:first-child"
          text: "Cancel"
        description: "Click popup cancel button"
      - action: wait
        value: "2000"
        description: "Wait for popup close"
    description: "Handle draft popup"

  # 4. Close help panel
  - step: 5
    action: if_visible
    target:
      text: "Simplified editor screen"
    region: right
    then:
      - action: click_at
        value: "1221,40"
        expect:
          text_hidden: "Simplified editor screen"
        description: "Click help X → confirm panel disappears"
      - action: wait
        value: "1000"
        description: "Wait for help close"
    description: "Close help panel"

  # 5. Enter title
  - step: 6
    action: click_at
    value: "530,248"
    description: "Click title area"

  - step: 7
    action: key_combo
    value: "Meta+a"
    description: "Select all title"

  - step: 8
    action: type_text
    value: "{{title}}"
    humanize: true
    description: "Enter title"

  # 6. Enter content
  - step: 9
    action: click_at
    value: "530,363"
    description: "Click content area"

  - step: 10
    action: key_combo
    value: "Meta+a"
    description: "Select all content"

  - step: 11
    action: type_text
    value: "{{content}}"
    humanize: true
    description: "Enter content"

  # 7. Upload images
  - step: 12
    action: upload_file
    file_path: "{{image_0}}"
    optional: true
    description: "Upload image 1"

  - step: 13
    action: upload_file
    file_path: "{{image_1}}"
    optional: true
    description: "Upload image 2"

  - step: 14
    action: upload_file
    file_path: "{{image_2}}"
    optional: true
    description: "Upload image 3"

  - step: 15
    action: wait
    value: "2000"
    description: "Wait for image upload"

  # 8. Publish
  - step: 16
    action: scroll
    value: "up"
    description: "Scroll to top"

  - step: 17
    action: wait
    value: "1000"
    description: "Wait for scroll"

  - step: 18
    action: click_at
    value: "1207,22"
    description: "Click editor publish button"

  - step: 19
    action: wait
    value: "2000"
    description: "Wait for publish option popup"

  - step: 20
    action: screenshot
    description: "Confirm publish option popup"

  - step: 21
    action: click_at
    value: "1177,555"
    description: "Click final publish button"

  - step: 22
    action: wait
    value: "5000"
    description: "Wait for publish completion"

  # 9. Complete
  - step: 23
    action: screenshot
    description: "Publish completion screenshot"

  - step: 24
    action: save_session
    name: "naver_login"
    description: "Save refreshed session"
