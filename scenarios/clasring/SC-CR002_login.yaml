id: "SC-201"
name: "ClasRing Login"
description: "ClasRing dev site login → dashboard verification (Flutter CanvasKit)"
tags: [clasring, login]

steps:
  # 1. Access login page
  - step: 1
    action: navigate
    value: "https://clasring-dev.web.app/app/"
    description: "Access ClasRing login page"

  - step: 2
    action: wait
    value: "3000"
    description: "Wait for Flutter app loading"

  - step: 3
    action: screenshot
    description: "Check login form initial state"

  # 2. Email — click_at (using direct scan coordinates, x=644, y=327)
  - step: 4
    action: click_at
    value: "644,327"
    description: "Click email field (scan x=644, y=327)"

  - step: 5
    action: type_text
    value: "ceo@ailooplab.com"
    description: "Enter email"
    critical: true

  - step: 6
    action: screenshot
    description: "Confirm email entry (check cursor position)"

  # 3. Password — click_at (scan x=644, y=391)
  - step: 7
    action: click_at
    value: "644,391"
    description: "Click password field (scan x=644, y=391)"

  - step: 8
    action: type_text
    value: "Rla3623!@"
    description: "Enter password"
    critical: true

  - step: 9
    action: screenshot
    description: "Confirm email/password entry"

  # 4. Login button — click_at (scan x=640, y=460)
  - step: 10
    action: click_at
    value: "640,460"
    description: "Click login button (scan x=640, y=460)"
    critical: true
    change_threshold: 0.03

  - step: 11
    action: wait
    value: "4000"
    description: "Wait for login processing and dashboard loading"

  - step: 12
    action: screenshot
    description: "Verify login result and dashboard"
