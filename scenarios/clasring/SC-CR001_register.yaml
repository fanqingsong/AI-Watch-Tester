id: "SC-200"
name: "ClasRing Registration"
description: "ClasRing dev site registration (dynamic email + teardown cleanup)"
tags: [clasring, register]

steps:
  # 1. Access registration page
  - step: 1
    action: navigate
    value: "https://clasring-dev.web.app/app/?register=true"
    description: "Access ClasRing registration page"

  - step: 2
    action: wait
    value: "3000"
    description: "Wait for Flutter app loading"

  - step: 3
    action: screenshot
    description: "Check registration form initial state"

  # 2. Email — click by OCR placeholder text "Email"
  - step: 4
    action: find_and_click
    target:
      text: "Email"
    region: center
    description: "Click email field (OCR)"

  - step: 5
    action: type_text
    value: "test+{{timestamp}}@ailooplab.com"
    description: "Enter email (dynamic — unique per run)"
    critical: true

  - step: 6
    action: wait
    value: "1500"
    description: "Wait for email validation"

  - step: 7
    action: screenshot
    description: "Confirm email entry"

  # 3. Password — click directly with click_at (avoid Naver #pw pattern conflict in Learned Store)
  #    Actual coordinates: scan y=532 + AWT bar 31px = 563
  - step: 8
    action: click_at
    value: "640,563"
    description: "Click password field (direct coordinates)"

  - step: 9
    action: type_text
    value: "Rla3623!@"
    description: "Enter password"
    critical: true

  # 4. Confirm password — click_at (scan y=596 + 31px = 627)
  - step: 10
    action: click_at
    value: "640,627"
    description: "Click confirm password field (direct coordinates)"

  - step: 11
    action: type_text
    value: "Rla3623!@"
    description: "Enter confirm password"

  # 5. Name (representative name) — 50px scroll then click_at (scan y=660 + 31 - 50scroll = 641)
  - step: 12
    action: scroll
    value: "640,400,50"
    description: "Scroll to reveal name field"

  - step: 13
    action: wait
    value: "500"
    description: "Wait for scroll stabilization"

  - step: 14
    action: click_at
    value: "640,641"
    description: "Click name (representative) field (scan y=660+31-50=641)"

  - step: 15
    action: type_text
    value: "Test Representative"
    description: "Enter representative name"

  - step: 16
    action: screenshot
    description: "Confirm name entry"

  # 6. Academy name — 130px additional scroll (total 180px) then click_at (scan y=712+31-180=563)
  - step: 17
    action: scroll
    value: "640,400,130"
    description: "Additional scroll to reveal academy name field"

  - step: 18
    action: wait
    value: "500"
    description: "Wait for scroll stabilization"

  - step: 19
    action: click_at
    value: "640,563"
    description: "Click academy name (tutor name) field (scan y=712+31-180=563)"

  - step: 20
    action: type_text
    value: "Test Academy_{{random}}"
    description: "Enter academy name (dynamic — unique per run)"

  - step: 21
    action: screenshot
    description: "Confirm all fields entered"

  # 7. Scroll to terms agreement area (additional 270px → total 450px)
  - step: 22
    action: scroll
    value: "640,400,270"
    description: "Scroll to terms agreement + sign up button area"

  - step: 23
    action: wait
    value: "500"
    description: "Wait for scroll stabilization"

  - step: 24
    action: screenshot
    description: "Confirm terms + sign up button position"

  # 8. Click agree all checkbox (after 450px scroll, viewport coordinates)
  - step: 25
    action: click_at
    value: "493,495"
    description: "Click agree all checkbox"

  - step: 26
    action: wait
    value: "500"
    description: "Wait for check response"

  - step: 27
    action: screenshot
    description: "Confirm terms agreement state (all 3 checked)"

  # 9. Wait for sign up button to be ready (Flutter app needs time)
  - step: 27.5
    action: wait
    value: "3000"
    description: "Wait for sign up button to be ready and clickable"

  # 10. Click sign up button (after 450px scroll, viewport coordinates)
  - step: 28
    action: click_at
    value: "640,582"
    description: "Click sign up button"
    critical: true
    change_threshold: 0.03

  - step: 29
    action: wait
    value: "4000"
    description: "Wait for registration processing"

  - step: 30
    action: screenshot
    description: "Final confirmation of registration result"

# ---------------------------------------------------------------------------
# Teardown — Delete test user (Firebase Auth)
# TeardownExecutor: Failure only logs, does not affect test result
# ---------------------------------------------------------------------------
teardown:
  - type: shell
    command: "python scripts/cleanup_firebase_user.py 'test+{{timestamp}}@ailooplab.com'"
    timeout: 30
